name: MEKAAR Auto Build & Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to release (e.g. v1.1.0)'
        required: true
        default: 'v1.0.1'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build APK & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Create Build Environment (.env)
        run: |
          cat << 'EOF' > .env
          SUPABASE_URL=https://dummy.supabase.co
          SUPABASE_ANON_KEY=dummy_anon_key_for_build
          EOF

      - name: Configure Android Credentials (google-services.json)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          mkdir -p android/app
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s\n' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          else
            echo '{"project_info":{"project_number":"100000000000","project_id":"mekaar-chat-app","storage_bucket":"mekaar-chat-app.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:100000000000:android:0123456789abcdef012345","android_client_info":{"package_name":"com.mekaar.app"}},"oauth_client":[],"api_key":[{"current_key":"AIzaSyDummyReleaseApiKeyForBuildOnly123"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}}],"configuration_version":"1"}' > android/app/google-services.json
          fi
          python3 -m json.tool android/app/google-services.json > /dev/null

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Test Suite
        run: flutter test

      - name: Build Release APK
        run: flutter build apk --release

      - name: Rename Release Asset
        id: asset_info
        run: |
          TAG_NAME="${{ github.ref_name }}"
          if [ -z "$TAG_NAME" ] || [ "$TAG_NAME" = "main" ]; then
            TAG_NAME="${{ github.event.inputs.version }}"
          fi
          OUTPUT_APK="build/app/outputs/flutter-apk/app-release.apk"
          TARGET_APK="build/app/outputs/flutter-apk/Mekaar-${TAG_NAME}.apk"
          cp "$OUTPUT_APK" "$TARGET_APK"
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "target_apk=$TARGET_APK" >> $GITHUB_OUTPUT

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.asset_info.outputs.tag_name }}
          name: MEKAAR ${{ steps.asset_info.outputs.tag_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            ${{ steps.asset_info.outputs.target_apk }}
            build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
