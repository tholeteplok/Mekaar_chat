name: MEKAAR Auto Build & Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to release (e.g. v1.1.0)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build APK & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate Next Version
        id: semver
        run: |
          # 1. Temukan tag semver terakhir
          LATEST_TAG=$(git tag -l "v*.*.*" --sort=-v:refname | head -n 1)
          
          if [ -z "$LATEST_TAG" ]; then
            LATEST_TAG="v1.0.0"
            COMMIT_COUNT=$(git rev-list HEAD --count)
          else
            COMMIT_COUNT=$(git rev-list "${LATEST_TAG}..HEAD" --count)
          fi

          echo "Latest tag: $LATEST_TAG"
          echo "Commit count since $LATEST_TAG: $COMMIT_COUNT"

          # 2. Tentukan target versi
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            NEW_VERSION="${{ github.ref_name }}"
          elif [ -n "${{ github.event.inputs.version }}" ]; then
            NEW_VERSION="${{ github.event.inputs.version }}"
          else
            CLEAN_TAG="${LATEST_TAG#v}"
            IFS='.' read -r MAJOR MINOR PATCH <<< "$CLEAN_TAG"
            MAJOR=${MAJOR:-1}
            MINOR=${MINOR:-0}
            PATCH=${PATCH:-0}

            if [ "$COMMIT_COUNT" -ge 6 ]; then
              # Jika commit >= 6: bump minor (+0.1.0)
              NEW_MINOR=$((MINOR + 1))
              NEW_PATCH=$PATCH
              NEW_VERSION="v${MAJOR}.${NEW_MINOR}.${NEW_PATCH}"
            elif [ "$COMMIT_COUNT" -gt 0 ]; then
              # Jika commit 1-5: bump patch (+0.0.1)
              NEW_PATCH=$((PATCH + 1))
              NEW_VERSION="v${MAJOR}.${MINOR}.${NEW_PATCH}"
            else
              # Tidak ada commit baru, pertahankan tag lama
              NEW_VERSION="$LATEST_TAG"
            fi
          fi

          BUILD_NUMBER=$(git rev-list --count HEAD)
          CLEAN_VERSION="${NEW_VERSION#v}"

          echo "Target Version: $NEW_VERSION"
          echo "Clean Version: $CLEAN_VERSION"
          echo "Build Number: $BUILD_NUMBER"

          # Output ke step berikutnya
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "clean_version=$CLEAN_VERSION" >> $GITHUB_OUTPUT
          echo "build_number=$BUILD_NUMBER" >> $GITHUB_OUTPUT

          # 3. Update Git Tag otomatis jika tag belum ada
          if [ "$NEW_VERSION" != "$LATEST_TAG" ] || [ "$COMMIT_COUNT" -gt 0 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -fa "$NEW_VERSION" -m "Release $NEW_VERSION (Build $BUILD_NUMBER - Auto Build)"
            git push origin "$NEW_VERSION" --force || echo "Tag push completed or skipped"
          fi

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Create Build Environment (.env)
        env:
          ENV_FILE_CONTENT: ${{ secrets.ENV_FILE_CONTENT }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -n "$ENV_FILE_CONTENT" ]; then
            printf '%s\n' "$ENV_FILE_CONTENT" > .env
          elif [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_ANON_KEY" ]; then
            cat << EOF > .env
          SUPABASE_URL=$SUPABASE_URL
          SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY
          EOF
          else
            echo "::warning ::SUPABASE_URL / SUPABASE_ANON_KEY secret not set. Using dummy fallback values."
            cat << 'EOF' > .env
          SUPABASE_URL=https://dummy.supabase.co
          SUPABASE_ANON_KEY=dummy_anon_key_for_build
          EOF
          fi

      - name: Configure Android Credentials (google-services.json)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          mkdir -p android/app
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s\n' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          else
            echo '{"project_info":{"project_number":"100000000000","project_id":"mekaar-chat-app","storage_bucket":"mekaar-chat-app.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:100000000000:android:0123456789abcdef012345","android_client_info":{"package_name":"com.mekaar.app"}},"oauth_client":[],"api_key":[{"current_key":"AIzaSyDummyReleaseApiKeyForBuildOnly123"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}}],"configuration_version":"1"}' > android/app/google-services.json
          fi
          python3 -m json.tool android/app/google-services.json > /dev/null

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Test Suite
        run: flutter test

      - name: Build Release APKs (Split per ABI & Universal)
        env:
          BUILD_NAME: ${{ steps.semver.outputs.clean_version }}
          BUILD_NUMBER: ${{ steps.semver.outputs.build_number }}
        run: |
          flutter build apk --release --split-per-abi --build-name="$BUILD_NAME" --build-number="$BUILD_NUMBER" --dart-define-from-file=.env
          flutter build apk --release --build-name="$BUILD_NAME" --build-number="$BUILD_NUMBER" --dart-define-from-file=.env

      - name: Rename Release Assets
        id: asset_info
        env:
          TAG_NAME: ${{ steps.semver.outputs.new_version }}
        run: |
          OUT="build/app/outputs/flutter-apk"
          
          # Salin & beri nama jelas untuk masing-masing varian ABI hemat
          cp "$OUT/app-arm64-v8a-release.apk" "$OUT/Mekaar-${TAG_NAME}-arm64-v8a.apk" || true
          cp "$OUT/app-armeabi-v7a-release.apk" "$OUT/Mekaar-${TAG_NAME}-armeabi-v7a.apk" || true
          cp "$OUT/app-x86_64-release.apk" "$OUT/Mekaar-${TAG_NAME}-x86_64.apk" || true
          
          # Salin varian universal fallback
          cp "$OUT/app-release.apk" "$OUT/Mekaar-${TAG_NAME}-universal.apk" || true
          cp "$OUT/app-release.apk" "$OUT/Mekaar-${TAG_NAME}.apk" || true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.semver.outputs.new_version }}
          name: MEKAAR ${{ steps.semver.outputs.new_version }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            build/app/outputs/flutter-apk/Mekaar-*-arm64-v8a.apk
            build/app/outputs/flutter-apk/Mekaar-*-armeabi-v7a.apk
            build/app/outputs/flutter-apk/Mekaar-*-x86_64.apk
            build/app/outputs/flutter-apk/Mekaar-*-universal.apk
            build/app/outputs/flutter-apk/Mekaar-*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
